name: "📸 키오스크 화면 제보"
description: "실제로 이용하신 키오스크 화면 사진과 정보를 알려주세요. 노년층 안내를 더 정확하게 만드는 데 사용됩니다."
title: "[화면 제보] "
labels: ["screenshot-submission"]
body:
  - type: markdown
    attributes:
      value: |
        먼저 감사합니다! 🙏 제보해주신 사진은 `lib/kioskData.ts`의 안내 문구를 실제 화면에 더
        가깝게 다듬는 데만 사용됩니다.

        **제출 전에 꼭 확인해주세요**
        - 사진에 다른 사람의 얼굴, 카드번호, 결제 금액, 이름·전화번호 같은 개인정보가 보이지 않는지 확인해주세요.
        - 화면만 크게, 반사·흔들림 없이 나오도록 찍어주시면 좋아요.
  - type: dropdown
    id: kiosk-type
    attributes:
      label: 어떤 키오스크인가요?
      options:
        - 병원 접수・수납
        - 은행 ATM
        - 패스트푸드・카페 주문
        - 기타 (아래 설명 칸에 적어주세요)
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: 어떤 단계의 화면인가요?
      description: "예: 시작 화면, 본인 확인, 메뉴 선택, 결제 화면 등"
      placeholder: "예: 결제 화면"
    validations:
      required: true
  - type: input
    id: brand
    attributes:
      label: 브랜드・기관명 (선택)
      description: "예: 맥도날드, OO은행, OO병원 — 정확한 지점명까지는 필요 없어요."
      placeholder: "예: 맥도날드"
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: 사진 첨부
      description: "이 칸을 클릭한 뒤 사진을 끌어다 놓거나 붙여넣으면 자동으로 업로드돼요."
      placeholder: "여기에 사진을 끌어다 놓아주세요"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 추가로 알려주실 내용 (선택)
      description: "이 화면에서 헷갈렸던 점, 실제 버튼 문구, 순서가 저희 안내와 달랐던 점 등 자유롭게 적어주세요."
    validations:
      required: false
  - type: checkboxes
    id: privacy-consent
    attributes:
      label: 확인 사항
      options:
        - label: 이 사진에는 다른 사람의 얼굴이나 개인정보(카드번호, 결제금액, 이름, 전화번호 등)가 보이지 않습니다.
          required: true
        - label: 이 사진을 프로젝트의 안내 문구 작성・검수 목적으로 사용하는 데 동의합니다.
          required: true
